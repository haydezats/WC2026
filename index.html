function fmt(iso, kind){
  const d = new Date(iso);
  const tz = "Australia/Sydney";
  if(kind==="dayKey") return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  if(kind==="dayLabel") return new Intl.DateTimeFormat("en-GB",{timeZone:tz,weekday:"short",day:"numeric",month:"short"}).format(d);
  if(kind==="time") return new Intl.DateTimeFormat("en-AU",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true}).format(d).replace(/\s/,"").toLowerCase();
  return iso;
}

/* ---------- scoring engine (ready for when results + draft land) ---------- */
function teamStats(){
  const s = {};
  const bump = (t,tp,gf,ga)=>{ if(!s[t]) s[t]={tp:0,gf:0,ga:0,p:0}; s[t].tp+=tp; s[t].gf+=gf; s[t].ga+=ga; s[t].p+=1; };
  DATA.groupFixtures.forEach(m=>{
    const r=m.result; if(!r||!r.played) return;
    const h=r.homeGoals, a=r.awayGoals;
    bump(m.home, h>a?3:h===a?1:0, h, a);
    bump(m.away, a>h?3:h===a?1:0, a, h);
  });
  DATA.knockout.rounds.forEach(rd=>rd.matches.forEach(m=>{
    const r=m.result; if(!r||!r.played) return;
    const hT=r.homeTeam||(m.home&&m.home.team), aT=r.awayTeam||(m.away&&m.away.team);
    if(!hT||!aT) return;
    const h=r.homeGoals, a=r.awayGoals;
    if(r.penalties){ bump(hT,1,h,a); bump(aT,1,a,h); }
    else { bump(hT, h>a?3:1, h, a); bump(aT, a>h?3:1, a, h); }
  }));
  return s;
}
function champion(){
  const fin = DATA.knockout.rounds.find(r=>r.round==="Final");
  if(!fin) return null; const m=fin.matches[0]; const r=m.result;
  if(!r||!r.played) return null;
  return r.winner==="away" ? (r.awayTeam) : (r.homeTeam);
}
function linearAlloc(members, metric, asc, max){
  // returns map memberIdx->points, tie-aware linear from max..0
  const N=members.length; if(N<=1) return members.map(()=>max);
  const idx=members.map((_,i)=>i).sort((x,y)=>asc?metric[x]-metric[y]:metric[y]-metric[x]);
  const v=i=>max*(N-1-i)/(N-1);
  const pts=Array(N).fill(0); let i=0;
  while(i<N){ let j=i; while(j+1<N && metric[idx[j+1]]===metric[idx[i]]) j++;
    let avg=0; for(let k=i;k<=j;k++) avg+=v(k); avg/=(j-i+1);
    for(let k=i;k<=j;k++) pts[idx[k]]=avg; i=j+1; }
  return pts;
}
function standings(){
  const ts=teamStats(); const champ=champion();
  const anyPlayed=Object.keys(ts).length>0;
  const drafted=DATA.members.some(m=>m.teams.length>0);
  const rows=DATA.members.map(m=>{
    let tp=0,gf=0,ga=0; m.teams.forEach(t=>{ if(ts[t]){tp+=ts[t].tp;gf+=ts[t].gf;ga+=ts[t].ga;} });
    return {name:m.name, teams:m.teams, tp, gf, ga, hasChamp: champ&&m.teams.includes(champ)};
  });
  const live = anyPlayed && drafted;
  let alloc={tp:rows.map(()=>0),gf:rows.map(()=>0),ga:rows.map(()=>0)};
  if(live){
    alloc.tp=linearAlloc(rows,rows.map(r=>r.tp),false,30);
    alloc.gf=linearAlloc(rows,rows.map(r=>r.gf),false,15);
    alloc.ga=linearAlloc(rows,rows.map(r=>r.ga),true,15);
  }
  rows.forEach((r,i)=>{ r.pChamp=r.hasChamp?40:0; r.pTp=alloc.tp[i]; r.pGf=alloc.gf[i]; r.pGa=alloc.ga[i];
    r.total=r.pChamp+r.pTp+r.pGf+r.pGa; });
  rows.sort((a,b)=>b.total-a.total);
  return {rows, live, champ};
}

/* ---------- live scoring from API-Football results ---------- */
function liveTeamStats(fixtures){
  const s={};
  const bump=(apiName,tp,gf,ga)=>{ const t=apiTeamName(apiName); if(!s[t]) s[t]={tp:0,gf:0,ga:0,w:0,d:0,l:0,p:0}; s[t].tp+=tp; s[t].gf+=gf; s[t].ga+=ga; s[t].p+=1; if(tp===3)s[t].w++; else if(tp===1)s[t].d++; else s[t].l++; };
  (fixtures||[]).forEach(f=>{
    const st=f.fixture.status.short; if(["FT","AET","PEN"].indexOf(st)<0) return;
    const h=f.goals.home, a=f.goals.away; if(h==null||a==null) return;
    if(st==="PEN"){ bump(f.teams.home.name,1,h,a); bump(f.teams.away.name,1,a,h); }  // penalties count as a draw
    else { bump(f.teams.home.name, h>a?3:(h===a?1:0), h, a); bump(f.teams.away.name, a>h?3:(a===h?1:0), a, h); }
  });
  return s;
}
function liveChampion(fixtures){
  const fin=(fixtures||[]).find(f=>String(f.league.round||"").toLowerCase()==="final" && ["FT","AET","PEN"].indexOf(f.fixture.status.short)>=0);
  if(!fin) return null;
  if(fin.fixture.status.short==="PEN" && fin.score && fin.score.penalty && fin.score.penalty.home!=null)
    return apiTeamName(fin.score.penalty.home>fin.score.penalty.away?fin.teams.home.name:fin.teams.away.name);
  const h=fin.goals.home,a=fin.goals.away; if(h==null) return null;
  return apiTeamName(h>=a?fin.teams.home.name:fin.teams.away.name);
}
function buildStandings(ts){
  const anyPlayed=Object.keys(ts).length>0;
  const drafted=DATA.members.some(m=>m.teams.length>0);
  const rows=DATA.members.map(m=>{ let tp=0,gf=0,ga=0,w=0,d=0,l=0,pl=0;
    const teamsData=m.teams.map(t=>{ const x=ts[t]||{tp:0,gf:0,ga:0,w:0,d:0,l:0,p:0};
      tp+=x.tp;gf+=x.gf;ga+=x.ga;w+=x.w;d+=x.d;l+=x.l;pl+=x.p;
      return {name:t, p:x.p, w:x.w, d:x.d, l:x.l, gf:x.gf, ga:x.ga, contrib:x.tp+x.gf-x.ga}; });
    teamsData.sort((a,b)=> b.contrib-a.contrib || b.p-a.p);
    return {name:m.name, teams:m.teams, teamsData, tp, gf, ga, w, d, l, pl, total: tp+gf-ga}; }); // 3 win / 1 draw + GF - GA
  rows.sort((a,b)=> b.total-a.total || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf || a.name.localeCompare(b.name));
  return {rows, live: anyPlayed && drafted};
}

async function fbFetch(path, params){
  const qs = new URLSearchParams(Object.assign({path:path}, params||{})).toString();
  const r = await fetch("/api/football?"+qs, {cache:"no-store"});
  let j=null; try{ j=await r.json(); }catch(e){}

/* ---------- Olé Olé Olé celebration overlay ---------- */
function OleParty({onClose}){
  const cvs=React.useRef(null), raf=React.useRef(0), last=React.useRef(0), t0=React.useRef(0), parts=React.useRef([]);
  const [stage,setStage]=React.useState("go");
  const [closing,setClosing]=React.useState(false);
  const DUR=5000;

  React.useEffect(()=>{
    const c=cvs.current; if(!c) return;
    const COLORS=["#E8B23A","#F0697D","#3FD08B","#5AA9F0","#B98BF0","#F0A35A","#5AE0F0","#ffffff"];
    const fit=()=>{ c.width=c.clientWidth||window.innerWidth; c.height=c.clientHeight||window.innerHeight; };
    fit();
    const spawn=()=>({ x:Math.random()*c.width, y:-Math.random()*c.height*0.6, vy:90+Math.random()*160,
      vx:(Math.random()-0.5)*60, w:5+Math.random()*6, h:9+Math.random()*16, rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*8, col:COLORS[(Math.random()*COLORS.length)|0], rib:Math.random()<0.5 });
    const N=Math.max(70, Math.min(180, Math.floor(c.width/7)));
    parts.current=Array.from({length:N}, spawn);

    const px=(ctx,x,y,w,h,col)=>{ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); };

    function drawStar(ctx, cx, baseY, P, el){
      const SW=16, SH=26, top=baseY-SH*P;
      const sway=Math.round(Math.sin(el/140));
      const frame=Math.floor(el/170)%2;
      const B=(ux,uy,uw,uh,col)=>px(ctx, cx+(ux-SW/2)*P+sway*P, top+uy*P, uw*P, uh*P, col);
      const sk="#d79a5b", hair="#1c1410", shirt="#f4f7ff", shirt2="#cfd6e6",
            pants="#16223c", shoe="#0b0f17", mic="#9aa6c4", micH="#2a2f3a";
      // podium
      px(ctx, cx-10*P+sway*P*0, baseY, 20*P, 8*P, "#E8B23A");
      px(ctx, cx-10*P, baseY, 20*P, 2*P, "#f1cb74");
      px(ctx, cx-3*P, baseY+3*P, 6*P, 4*P, "#b97f12");
      px(ctx, cx-1*P, baseY+3*P, 2*P, 4*P, "#f1cb74"); // "1"
      // legs
      if(frame){ B(5,17,3,8,pants); B(9,17,3,6,pants); } else { B(5,17,3,6,pants); B(9,17,3,8,pants); }
      B(4,24,4,2,shoe); B(9,24,4,2,shoe);
      // shirt + open chest
      B(4,8,8,9,shirt); B(4,8,8,2,shirt2); B(7,8,2,5,sk);
      // hip arm
      B(2,9,2,6,sk);
      // raised arm + microphone
      B(12,3,2,8,sk); B(12,1,2,2,sk); B(12,-3,2,4,mic); B(11,-5,4,2,micH);
      // neck + head
      B(6,7,4,2,sk); B(5,2,6,5,sk);
      B(5,0,6,2,hair); B(4,2,1,4,hair); B(11,2,1,4,hair);
      B(6,4,1,1,hair); B(9,4,1,1,hair);
    }

    const loop=(ts)=>{
      if(!t0.current) t0.current=ts;
      if(!last.current) last.current=ts;
      const el=ts-t0.current;
      let dt=(ts-last.current)/1000; last.current=ts; if(dt>0.05) dt=0.05;
      const ctx=c.getContext("2d"); const W=c.width, H=c.height;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle="rgba(8,12,22,0.80)"; ctx.fillRect(0,0,W,H);
      parts.current.forEach(p=>{
        p.vy+=150*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
        if(p.y>H+24){ p.y=-20; p.x=Math.random()*W; p.vy=90+Math.random()*160; }
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
        if(p.rib) ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); else ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w);
        ctx.restore();
      });
      const show = el>350 || (Math.floor(el/80)%2===0); // flash-in
      if(show){
        const P=Math.max(5, Math.min(14, Math.round(Math.min(W,H)/55)));
        drawStar(ctx, W/2, H*0.80, P, el);
      }
      if(el>=DUR){ onClose(); return; }
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    const t1=setTimeout(()=>setStage("ole"),1500);
    const t2=setTimeout(()=>setClosing(true),4600);
    window.addEventListener("resize",fit);
    return ()=>{ cancelAnimationFrame(raf.current); clearTimeout(t1); clearTimeout(t2); window.removeEventListener("resize",fit); };
  },[]);

  return (
    <div onPointerDown={onClose}
      style={{position:"fixed",inset:0,zIndex:9999,cursor:"pointer",opacity:closing?0:1,transition:"opacity .4s ease"}}>
      <style>{`@keyframes olePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
        @keyframes oleDrop{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}`}</style>
      <canvas ref={cvs} style={{position:"absolute",inset:0,width:"100%",height:"100%",display:"block"}}/>
      <div style={{position:"absolute",top:"15%",left:0,right:0,textAlign:"center",pointerEvents:"none"}}>
        <div key={stage} style={{display:"inline-block",fontFamily:"'Press Start 2P',monospace",
          fontSize:stage==="ole"?"min(9vw,46px)":"min(7vw,34px)",
          color:stage==="ole"?"#E8B23A":"#3FD08B",
          textShadow:"3px 3px 0 #0b0f17, 0 0 18px "+(stage==="ole"?"#E8B23A99":"#3FD08B99"),
          animation:"oleDrop .25s ease, olePulse .7s ease-in-out infinite",letterSpacing:2}}>
          {stage==="ole"?"OLÉ OLÉ OLÉ!":"GO GO GO!"}
        </div>
      </div>
    </div>
  );
}

/* ---------- 8-bit Penalty Shootout (skill build) ---------- */
const PEN = {
  sky:"#241734", stand:"#3a2a55", stand2:"#2c1f44", grass:"#2f9e44", grass2:"#268a3a",
  post:"#f4f7ff", net:"#9aa6c4", ball:"#ffffff", ink:"#0b0f17",
  kit:"#E8B23A", kit2:"#b97f12", skin:"#f1c27d", glove:"#F0697D", cap:"#23262e",
  goldT:"#E8B23A", good:"#3FD08B", bad:"#F0697D",
  sgreen:"#2fae57", samber:"#caa23a", sred:"#7a2230"
};
function Penalty(){
  const W=240, H=180;
  // 3x3 grid of shooting spots
  const ZONES = [
    {id:0, tx:72,  ty:60 }, {id:1, tx:120, ty:58 }, {id:2, tx:168, ty:60 },
    {id:3, tx:72,  ty:82 }, {id:4, tx:120, ty:82 }, {id:5, tx:168, ty:82 },
    {id:6, tx:72,  ty:104}, {id:7, tx:120, ty:104}, {id:8, tx:168, ty:104},
  ];
  const tierOf = (id)=> (id===4 ? "centre" : ([0,2,6,8].indexOf(id)>=0 ? "corner" : "edge"));
  const ONTARGET = { GREEN:0.97, AMBER:0.90, RED:0.70 };
  const SAVE = {
    corner:{ GREEN:0.30, AMBER:0.55, RED:0.80 },
    edge:  { GREEN:0.45, AMBER:0.65, RED:0.85 },
    centre:{ GREEN:0.60, AMBER:0.75, RED:0.90 },
  };
  const PREAD = 0.15; // flat: keeper dives at your exact spot 15% of the time, else random

  const cvs   = React.useRef(null);
  const raf   = React.useRef(0);
  const timers= React.useRef([]);
  const savedRef=React.useRef(false), awaitingRef=React.useRef(false);
  const initScores=(()=>{ try{ return JSON.parse(localStorage.getItem("wc26_pen_scores")||"[]"); }catch(e){ return []; } })();
  const scoresRef=React.useRef(initScores);
  const g = React.useRef({
    phase:"aim", t:0, start:0, player:0, keeperZ:4, quality:null, outcome:null,
    bx:120, by:150, tx:120, ty:60, kx:120, ky:86,
    sliderPos:0.5, sliderDir:1, sliderSpeed:1.1, sLast:0, greenC:0.5, greenW:0.30, amberW:0.10,
    streak:0, best:Number(localStorage.getItem("wc26_pen_best")||0),
    msg:"PICK A SPOT", res:null
  });
  const [ui,setUi] = React.useState({streak:0, best:g.current.best, phase:"aim", msg:"PICK A SPOT", res:null});
  const sync=()=>{ const m=g.current; setUi({streak:m.streak,best:m.best,phase:m.phase,msg:m.msg,res:m.res}); };
  const [scores,setScoresState] = React.useState(initScores);
  const setScores=(v)=>{ scoresRef.current=v; setScoresState(v); };
  const [nameInput,setNameInput] = React.useState("");
  const [saved,setSaved] = React.useState(false);
  const [online,setOnline] = React.useState(false);

  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeOut=t=>1-Math.pow(1-t,2);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const px=(ctx,x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); };

  function drawKeeper(ctx,cx,cy,dx,dy){
    const k=PEN.kit,k2=PEN.kit2,gl=PEN.glove,sk=PEN.skin,cap=PEN.cap;
    px(ctx,cx-5,cy+6,4,8,k2); px(ctx,cx+1,cy+6,4,8,k2);   // legs
    px(ctx,cx-6,cy-8,12,16,k); px(ctx,cx-6,cy-8,12,3,k2); // body
    px(ctx,cx-4,cy-16,8,8,sk);                            // head
    px(ctx,cx-5,cy-18,10,4,cap);                          // Cech-style cap: crown
    px(ctx,cx-5,cy-14,2,5,cap); px(ctx,cx+3,cy-14,2,5,cap); // ear flaps
    px(ctx,cx-4,cy-9,8,1,cap);                            // chin strap
    px(ctx,cx-2,cy-12,2,2,PEN.ink);                       // eye
    if(dx===0 && dy<=0){
      px(ctx,cx-9,cy-14,3,10,k);  px(ctx,cx+6,cy-14,3,10,k);
      px(ctx,cx-10,cy-18,5,5,gl); px(ctx,cx+6,cy-18,5,5,gl);
    } else {
      const s = dx>=0?1:-1;
      const ay = dy<0 ? cy-12 : (dy>0 ? cy+2 : cy-5);
      px(ctx, s>0?cx+5:cx-8,  ay,   3,12, k);   // reaching arm
      px(ctx, s>0?cx+8:cx-13, ay+8, 6,6,  gl);  // far glove
      px(ctx, s>0?cx-9:cx+6,  cy-2, 3,8,  k);   // trailing arm
      px(ctx, s>0?cx-11:cx+8, cy+2, 5,5,  gl);
    }
  }

  function drawSlider(ctx,m){
    const x0=26, x1=214, w=x1-x0, y=160, bh=8;
    px(ctx,x0-2,y-2,w+4,bh+4,PEN.ink);
    px(ctx,x0,y,w,bh,PEN.sred);
    const seg=(a,b,col)=>{ const L=clamp(a,0,1),R=clamp(b,0,1); if(R>L) px(ctx,x0+L*w,y,(R-L)*w,bh,col); };
    seg(m.greenC-m.greenW/2-m.amberW, m.greenC+m.greenW/2+m.amberW, PEN.samber);
    seg(m.greenC-m.greenW/2,          m.greenC+m.greenW/2,          PEN.sgreen);
    const mx = x0 + clamp(m.sliderPos,0,1)*w;
    px(ctx, mx-1, y-4, 3, bh+8, PEN.post);
  }

  function draw(){
    const ctx = cvs.current && cvs.current.getContext("2d"); if(!ctx) return;
    const m=g.current;
    px(ctx,0,0,W,H,PEN.sky);
    for(let i=0;i<W;i+=8){ px(ctx,i,8,6,4,(i/8)%2?PEN.stand:PEN.stand2); px(ctx,i+2,16,4,3,(i/8)%2?PEN.stand2:PEN.stand); }
    px(ctx,0,120,W,H-120,PEN.grass);
    for(let i=0;i<W;i+=16) px(ctx,i,120,8,H-120,PEN.grass2);
    px(ctx,40,40,W-80,4,PEN.post);  // crossbar
    px(ctx,40,40,4,82,PEN.post);    // left post
    px(ctx,196,40,4,82,PEN.post);   // right post
    ctx.fillStyle=PEN.net;
    for(let x=46;x<196;x+=10) ctx.fillRect(x,44,1,76);
    for(let y=46;y<120;y+=10) ctx.fillRect(44,y,152,1);
    px(ctx,118,150,4,2,PEN.post);   // penalty spot
    if(m.phase==="aim"){
      ZONES.forEach((z,i)=>{
        const on=i===m.player;
        px(ctx,z.tx-5,z.ty-5,10,10,on?PEN.goldT:"#ffffff22");
        px(ctx,z.tx-3,z.ty-3,6,6,PEN.sky);
        px(ctx,z.tx-1,z.ty-1,2,2,on?PEN.goldT:PEN.net);
      });
    }
    let dx=0,dy=0;
    if(m.phase==="kick"||m.phase==="over"){ const kz=ZONES[m.keeperZ]; dx=Math.sign(kz.tx-120); dy=Math.sign(kz.ty-82); }
    drawKeeper(ctx,m.kx,m.ky,dx,dy);
    px(ctx,m.bx-4,m.by-4,8,8,PEN.ball);
    px(ctx,m.bx-4,m.by-4,8,1,PEN.ink);
    px(ctx,m.bx-4,m.by+3,8,1,PEN.ink);
    px(ctx,m.bx-1,m.by-2,2,2,PEN.ink);
    if(m.phase==="strike") drawSlider(ctx,m);
  }

  // ---- aim: choose a spot, then launch the timing slider ----
  function pickSpot(id){
    const m=g.current;
    if(m.phase!=="aim") return;
    m.player=id;
    m.greenW = clamp(0.30 - m.streak*0.009, 0.09, 0.30);  // green shrinks with streak (only ramp)
    m.amberW = 0.10;
    const margin = m.greenW/2 + 0.05;
    m.greenC = margin + Math.random()*(1-2*margin);       // random green position each shot
    m.sliderSpeed = Math.min(2.4, 1.05 + m.streak*0.05);
    m.sliderPos = Math.random(); m.sliderDir = Math.random()<0.5?-1:1; m.sLast=0;
    m.phase="strike"; m.res=null; m.msg="TIME THE STRIKE!";
    sync();
    cancelAnimationFrame(raf.current); raf.current=requestAnimationFrame(sliderStep);
  }

  function sliderStep(ts){
    const m=g.current; if(m.phase!=="strike") return;
    if(!m.sLast) m.sLast=ts;
    const dt=Math.min(0.05,(ts-m.sLast)/1000); m.sLast=ts;
    m.sliderPos += m.sliderDir*m.sliderSpeed*dt;
    if(m.sliderPos>=1){ m.sliderPos=1; m.sliderDir=-1; }
    if(m.sliderPos<=0){ m.sliderPos=0; m.sliderDir=1; }
    draw();
    raf.current=requestAnimationFrame(sliderStep);
  }

  // ---- strike: stop the slider, roll keeper + outcome, launch the kick ----
  function strike(){
    const m=g.current;
    if(m.phase!=="strike") return;
    cancelAnimationFrame(raf.current);
    const d=Math.abs(m.sliderPos-m.greenC);
    m.quality = d<=m.greenW/2 ? "GREEN" : (d<=m.greenW/2+m.amberW ? "AMBER" : "RED");
    m.keeperZ = Math.random()<PREAD ? m.player : Math.floor(Math.random()*9);
    if(Math.random() > ONTARGET[m.quality]) m.outcome="MISS";
    else if(m.keeperZ!==m.player) m.outcome="GOAL";
    else m.outcome = Math.random() < SAVE[tierOf(m.player)][m.quality] ? "SAVED" : "GOAL";
    const z=ZONES[m.player];
    if(m.outcome==="MISS"){
      if(z.ty<82 || Math.random()<0.5){ m.tx=z.tx; m.ty=26; }                 // over the bar
      else { m.tx = z.tx<120?24:(z.tx>120?216:(Math.random()<0.5?24:216)); m.ty=z.ty; } // wide
    } else { m.tx=z.tx; m.ty=z.ty; }
    m.t=0; m.start=0; m.phase="kick"; m.msg="…"; m.res=null;
    sync();
    raf.current=requestAnimationFrame(step);
  }

  function step(ts){
    const m=g.current;
    if(!m.start) m.start=ts;
    m.t=Math.min(1,(ts-m.start)/600);
    m.bx=lerp(120,m.tx,easeOut(m.t));
    m.by=lerp(150,m.ty,easeOut(m.t));
    const kz=ZONES[m.keeperZ];
    const kt=Math.max(0,(m.t-0.05)/0.95);
    m.kx=lerp(120,kz.tx,easeOut(kt));
    m.ky=lerp(86,kz.ty,easeOut(kt));
    draw();
    if(m.t<1) raf.current=requestAnimationFrame(step);
    else finishKick();
  }

  function finishKick(){
    const m=g.current;
    if(m.outcome==="GOAL"){
      m.res="GOAL"; m.streak+=1; m.msg=["GOAL!","TOP BINS!","GOLAZO!","SCORED!","BURIED IT!"][m.streak%5];
      const t=setTimeout(()=>{
        const mm=g.current;
        mm.phase="aim"; mm.res=null; mm.t=0; mm.bx=120; mm.by=150; mm.kx=120; mm.ky=86; mm.msg="PICK A SPOT";
        draw(); sync();
      },820);
      timers.current.push(t);
    } else {
      m.phase="over";
      if(m.outcome==="SAVED"){ m.res="SAVED"; m.msg="SAVED!"; }
      else { m.res="MISS"; m.msg=["OFF TARGET!","OVER THE BAR!","WIDE!","SKIED IT!"][Math.floor(Math.random()*4)]; }
      if(m.streak>m.best){ m.best=m.streak; try{localStorage.setItem("wc26_pen_best",String(m.best));}catch(e){} }
      savedRef.current=false; setSaved(false); setNameInput("");
      const list=scoresRef.current;
      awaitingRef.current = m.streak>0 && (list.length<5 || m.streak>list[list.length-1].score);
    }
    draw(); sync();
  }

  function retry(){
    const m=g.current;
    m.phase="aim"; m.t=0; m.res=null; m.streak=0; m.outcome=null; m.quality=null;
    m.bx=120; m.by=150; m.kx=120; m.ky=86; m.player=0; m.msg="PICK A SPOT";
    savedRef.current=false; awaitingRef.current=false; setSaved(false); setNameInput("");
    draw(); sync();
  }

  React.useEffect(()=>{
    draw(); sync();
    fetch("/api/scores?game=penalty").then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>{ if(d&&Array.isArray(d.scores)){ setOnline(true); setScores(d.scores);
        try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(d.scores)); }catch(e){} } })
      .catch(()=>setOnline(false));
    const onKey=(e)=>{
      if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
      const m=g.current;
      if(m.phase==="aim"){ const map={"7":0,"8":1,"9":2,"4":3,"5":4,"6":5,"1":6,"2":7,"3":8}; if(e.key in map){ e.preventDefault(); pickSpot(map[e.key]); } return; }
      if(m.phase==="strike"){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); strike(); } return; }
      if(m.phase==="over"){ if((e.key==="Enter"||e.key===" ") && !awaitingRef.current){ e.preventDefault(); retry(); } return; }
    };
    window.addEventListener("keydown",onKey);
    return ()=>{ window.removeEventListener("keydown",onKey); cancelAnimationFrame(raf.current); timers.current.forEach(clearTimeout); };
  },[]);

  const PAD = [["↖",0],["↑",1],["↗",2],["←",3],["●",4],["→",5],["↙",6],["↓",7],["↘",8]];
  const PadBtn=({label,id})=>(
    <button onClick={()=>pickSpot(id)} disabled={ui.phase!=="aim"} aria-label={"Shoot spot "+(id+1)}
      style={{fontFamily:"'Press Start 2P',monospace",fontSize:13,
        color:ui.phase==="aim"?C.text:C.dim, background:C.panel2,
        border:"2px solid "+(ui.phase==="aim"?PEN.goldT:C.line), borderRadius:8,
        padding:"12px 0", cursor:ui.phase==="aim"?"pointer":"default",
        boxShadow:ui.phase==="aim"?"0 3px 0 "+PEN.kit2:"none", touchAction:"manipulation"}}>{label}</button>
  );

  const qualifies = ui.streak>0 && (scores.length<5 || ui.streak>scores[scores.length-1].score);
  async function saveScore(){
    awaitingRef.current=false;
    const nm=(nameInput.trim()||"YOU").toUpperCase().slice(0,10);
    const sc=g.current.streak;
    savedRef.current=true; setSaved(true); setNameInput("");
    if(online){
      try{
        const r=await fetch("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({game:"penalty",name:nm,score:sc})});
        if(r.ok){ const d=await r.json();
          if(d&&Array.isArray(d.scores)){ setScores(d.scores);
            try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(d.scores)); }catch(e){}
            return; } }
      }catch(e){}
    }
    const next=[...scores,{name:nm,score:sc}].sort((a,b)=>b.score-a.score).slice(0,5);
    setScores(next);
    try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(next)); }catch(e){}
  }

  const resColor = ui.res==="GOAL" ? PEN.good : PEN.bad;

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-3 flex items-center justify-between" style={{background:C.card,border:"1px solid "+C.lineSoft}}>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.goldT}}>STREAK <b style={{color:C.text}}>{ui.streak}</b></span>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:1.5,color:C.text}}>PENALTY DASH</span>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.sub}}>BEST <b style={{color:PEN.good}}>{ui.best}</b></span>
      </div>

      <div className="relative mx-auto" style={{width:"100%",maxWidth:360}}>
        <canvas ref={cvs} width={W} height={H}
          onPointerDown={(e)=>{ if(g.current.phase==="strike"){ e.preventDefault(); strike(); } }}
          style={{width:"100%",height:"auto",imageRendering:"pixelated",borderRadius:8,
            border:"2px solid "+C.line, background:PEN.sky, display:"block", touchAction:"manipulation",
            cursor:ui.phase==="strike"?"pointer":"default"}}/>
        {ui.phase==="aim" && ZONES.map(z=>(
          <button key={z.id} onClick={()=>pickSpot(z.id)} aria-label={"Aim spot "+(z.id+1)}
            style={{position:"absolute",left:(z.tx/W*100)+"%",top:(z.ty/H*100)+"%",
              transform:"translate(-50%,-50%)",width:"24%",height:"15%",
              background:"transparent",border:"0",cursor:"pointer",touchAction:"manipulation"}}/>
        ))}
        {ui.res && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:15,
              color:resColor,textShadow:"2px 2px 0 "+PEN.ink}}>{ui.msg}</div>
          </div>
        )}
        {ui.phase==="over" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3"
            style={{background:"rgba(8,12,22,.88)",borderRadius:8,padding:12}}>
            {qualifies && !saved ? (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:PEN.goldT,textShadow:"2px 2px 0 "+PEN.ink}}>NEW TOP 5!</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.sub}}>STREAK {ui.streak} — ENTER NAME</div>
                <input value={nameInput} onChange={e=>setNameInput(e.target.value)} maxLength={10} autoFocus
                  onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); saveScore(); } }}
                  placeholder="YOUR NAME"
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,textAlign:"center",textTransform:"uppercase",
                    color:C.text,background:PEN.ink,border:"2px solid "+PEN.goldT,borderRadius:6,padding:"10px 8px",width:"78%",maxWidth:220,outline:"none"}}/>
                <div className="flex items-center gap-4">
                  <button onClick={(e)=>{ e.stopPropagation(); saveScore(); }}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.ink,background:PEN.goldT,
                      border:"0",borderRadius:6,padding:"10px 16px",cursor:"pointer",boxShadow:"0 3px 0 "+PEN.kit2}}>SAVE ✓</button>
                  <button onClick={(e)=>{ e.stopPropagation(); awaitingRef.current=false; savedRef.current=true; setSaved(true); }}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.dim,background:"transparent",border:"0",cursor:"pointer"}}>SKIP</button>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:14,color:saved?PEN.good:PEN.bad,textShadow:"2px 2px 0 "+PEN.ink}}>{saved?"ON THE BOARD!":ui.msg}</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:C.sub}}>STREAK {ui.streak} · BEST {ui.best}</div>
                <button onClick={(e)=>{ e.stopPropagation(); retry(); }}
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.ink,background:PEN.goldT,
                    border:"0",borderRadius:6,padding:"12px 18px",cursor:"pointer",boxShadow:"0 3px 0 "+PEN.kit2}}>RETRY ▶</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      {ui.phase==="strike" ? (
        <button onClick={strike} className="mx-auto"
          style={{width:"100%",maxWidth:360,fontFamily:"'Press Start 2P',monospace",fontSize:13,color:PEN.ink,
            background:PEN.good,border:"0",borderRadius:10,padding:"16px",cursor:"pointer",
            boxShadow:"0 4px 0 #2a8a55",touchAction:"manipulation"}}>⚡ STRIKE! (hit the green)</button>
      ) : (
        <div className="grid mx-auto" style={{width:"100%",maxWidth:360,gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {PAD.map(([label,id])=>(<PadBtn key={id} label={label} id={id}/>))}
        </div>
      )}

      <div className="rounded-xl overflow-hidden mx-auto" style={{width:"100%",maxWidth:360,border:"1px solid "+C.lineSoft}}>
        <div style={{background:C.panel,padding:"10px 12px",textAlign:"center"}}>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:PEN.goldT,letterSpacing:.5}}>★ TOP 5 · PENALTY KINGS ★</div>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:online?PEN.good:C.dim,marginTop:6,letterSpacing:.5}}>{online?"GLOBAL · LIVE":"THIS DEVICE"}</div>
        </div>
        {scores.length===0 ? (
          <div style={{fontSize:12,color:C.dim,textAlign:"center",padding:"16px 12px",background:C.card}}>No scores yet — set a streak and put your name up.</div>
        ) : scores.map((s,i)=>(
          <div key={i} className="flex items-center justify-between" style={{padding:"10px 12px",background:i%2?C.panel2:C.card,borderTop:"1px solid "+C.lineSoft}}>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:i===0?PEN.goldT:C.sub,minWidth:34}}>{["1ST","2ND","3RD","4TH","5TH"][i]}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.text,flex:1,padding:"0 10px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:i===0?PEN.good:C.text}}>{s.score}</span>
          </div>
        ))}
      </div>

      <div style={{fontSize:12,color:C.dim,lineHeight:1.5,textAlign:"center"}}>
        Pick one of 9 spots, then <b style={{color:C.sub}}>tap / Space</b> to stop the bar in the <span style={{color:PEN.good}}>green</span> for a clean strike.
        The keeper only saves if it dives to your exact spot — and even then a green strike can beat it. Corners are safest, the middle riskiest.
        A scuffed strike can miss entirely. One save or miss ends the run.
      </div>
    </div>
  );
}

/* ---------- Divers: Neill v Grosso (skill endless-runner tab) ---------- */
function Divers(){
  const W=320, H=150, GROUND=124, PX=40, PW=14, PH=22;
  const GRAV=1300, JUMP=-370, SPD0=170, ACCEL=10, SPDMAX=420;
  const DV = { gold:"#E8B23A", goldDk:"#b97f12", blue:"#2f6fe0", blueDk:"#1f4fa8",
    skin:"#f1c27d", navy:"#16223c", white:"#f4f7ff", sky:"#1b2740", sky2:"#101a30",
    stand:"#26344f", crowd:"#3a4a6a", grass:"#2f9e44", grass2:"#268a3a", ink:"#0b0f17",
    band:"#F0697D", good:"#3FD08B", bad:"#F0697D" };
  const cvs=React.useRef(null), raf=React.useRef(0);
  const m=React.useRef(null);
  const overTxt=React.useRef("PENALTY GIVEN!");
  const savedRef=React.useRef(false);
  const awaitingRef=React.useRef(false);
  const initScores=(()=>{ try{ return JSON.parse(localStorage.getItem("wc26_divers_scores")||"[]"); }catch(e){ return []; } })();
  const scoresRef=React.useRef(initScores);
  const [phase,setPhase]=React.useState("ready");
  const [score,setScore]=React.useState(0);
  const [best,setBest]=React.useState(Number(localStorage.getItem("wc26_divers_best")||0));
  const [scores,setScoresState]=React.useState(initScores);
  const [nameInput,setNameInput]=React.useState("");
  const [saved,setSaved]=React.useState(false);
  const [online,setOnline]=React.useState(false);
  const setScores=(v)=>{ scoresRef.current=v; setScoresState(v); };

  const px=(ctx,x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); };

  function fresh(){
    return { phase:"run", last:0, speed:SPD0, dist:0, scoreInt:0,
      scroll:0, bgScroll:0,
      p:{ feet:GROUND, vy:0, onGround:true, legT:0, legFrame:0 },
      obs:[], spawnDist:300 };
  }

  function makeObstacle(speed){
    const tall = Math.random()<0.40;
    const h = tall ? 26+Math.random()*9 : 14+Math.random()*9;   // swan dive vs low slide
    const w = tall ? 16+Math.random()*8 : 22+Math.random()*18;  // dives narrower, slides longer
    return { x:W+8, w:w, h:h, t:Math.random()*6, tall:tall };
  }
  // Heavily varied spacing: tighter and more frequent back-to-backs, with the odd breather.
  function nextGap(speed){
    const base = 96 + speed*0.30;             // minimum clearance, scales with pace (stays fair)
    const r = Math.random();
    let extra;
    if(r<0.26)      extra = 0   + Math.random()*45;   // tight (more frequent)
    else if(r<0.82) extra = 55  + Math.random()*160;  // normal
    else            extra = 220 + Math.random()*230;  // long breather
    return base + extra;
  }

  function drawPlayer(ctx, feet, onGround, frame){
    const x=PX, top=feet-PH;
    px(ctx, x-2, GROUND-1, PW+4, 2, "rgba(0,0,0,.28)"); // shadow
    px(ctx, x+3, top-7, 7,7, DV.skin);                  // head
    px(ctx, x+3, top-7, 7,2, DV.ink);                   // hair
    px(ctx, x+1, top, 11,12, DV.gold);                  // jersey
    px(ctx, x+1, top, 11,3, DV.goldDk);
    px(ctx, x+1, top+3, 3,2, DV.band);                  // captain's armband
    px(ctx, x+2, top+12, 9,4, DV.navy);                 // shorts
    px(ctx, x+11, top+2, 3,6, DV.skin);                 // pumping arm
    if(onGround){
      if(frame===0){ px(ctx, x+2, top+16, 3,6, DV.skin); px(ctx, x+8, top+16, 3,4, DV.skin); }
      else { px(ctx, x+2, top+16, 3,4, DV.skin); px(ctx, x+8, top+16, 3,6, DV.skin); }
    } else { px(ctx, x+2, top+16, 3,5, DV.skin); px(ctx, x+8, top+15, 4,4, DV.skin); }
  }

  function drawDiver(ctx, ob){
    const x=Math.round(ob.x), w=ob.w, h=ob.h, bottom=GROUND, top=bottom-h;
    const wob = Math.round(Math.sin(ob.t*9));
    px(ctx, x, GROUND-1, w, 2, "rgba(0,0,0,.30)");      // ground shadow
    if(ob.tall){
      // theatrical swan dive: arched in the air, head thrown back, arms flung up, trailing leg kicked high
      const cy = top + Math.round(h*0.5) + wob;
      px(ctx, x+w-9, top+2, 4,7, DV.navy);              // kicked-up thigh
      px(ctx, x+w-7, top-2, 3,6, DV.skin);              // kicked-up shin
      px(ctx, x+w-8, top-4, 5,3, DV.ink);               // boot in the air
      px(ctx, x+w-6, cy+2, 4,6, DV.navy);               // falling leg
      px(ctx, x+w-5, cy+8, 3,5, DV.skin);
      px(ctx, x+5, cy-4, w-12, 9, DV.blue);             // arched torso
      px(ctx, x+6, cy-6, w-14, 3, DV.blue);             // chest pushed up
      px(ctx, x+5, cy-4, w-12, 2, DV.blueDk);
      px(ctx, x+1, cy-9, 7,7, DV.skin);                 // head thrown back
      px(ctx, x+1, cy-11, 7,3, DV.ink);                 // hair
      px(ctx, x+2, cy-5, 3,2, DV.ink);                  // open mouth (appeal!)
      px(ctx, x+3, cy-13, 3,6, DV.skin); px(ctx, x+2, cy-15, 4,3, DV.skin); // arm up
      px(ctx, x-3, cy-6, 5,3, DV.skin);  px(ctx, x-5, cy-7, 3,3, DV.skin);  // arm out front
    } else {
      // low slide/sprawl: flung along the turf, arms reaching, one boot up
      const bh = Math.max(7, h-4), bodyTop = bottom-2-bh;
      px(ctx, x+w-10, bottom-7, 6,4, DV.navy);          // shorts
      px(ctx, x+w-4, bottom-6, 4,4, DV.skin); px(ctx, x+w-1, bottom-8, 3,3, DV.ink); // shin + boot
      px(ctx, x+w-8, bottom-11, 3,5, DV.skin);          // raised lower leg
      px(ctx, x+4, bodyTop, w-9, bh, DV.blue);          // long low body
      px(ctx, x+4, bodyTop, w-9, 2, DV.blueDk);
      px(ctx, x, bodyTop-3+wob, 7,7, DV.skin);          // head leading
      px(ctx, x, bodyTop-3+wob, 7,2, DV.ink);           // hair
      px(ctx, x+1, bodyTop+1, 3,2, DV.ink);             // mouth
      px(ctx, x-3, bodyTop+1, 5,3, DV.skin); px(ctx, x-5, bodyTop+1, 3,3, DV.skin); // arm reaching
      px(ctx, x-2, bodyTop-2+wob, 3,3, DV.skin);        // upper hand
    }
    for(let i=1;i<=3;i++) px(ctx, x+w+i*3, top+Math.round(h*0.6), 2,2, "rgba(255,255,255,.22)"); // motion lines
  }

  function render(){
    const ctx = cvs.current && cvs.current.getContext("2d"); if(!ctx) return;
    const g=m.current;
    const bg = g?g.bgScroll:0, sc = g?g.scroll:0;
    px(ctx,0,0,W,H,DV.sky); px(ctx,0,0,W,40,DV.sky2);
    px(ctx,0,40,W,18,DV.stand);                          // stands
    for(let i=0;i<W+10;i+=6){ const o=(i-(bg%6)); px(ctx,o,44,3,3,"#46577a"); px(ctx,o+2,50,2,2,"#37466a"); }
    px(ctx,0,58,W,3,DV.blueDk);                          // advert hoarding
    px(ctx,0,GROUND,W,H-GROUND,DV.grass);                // pitch
    for(let i=-1;i<W/18+1;i++){ const o=i*18-(sc%18); px(ctx,o,GROUND,9,H-GROUND,DV.grass2); }
    px(ctx,0,GROUND-1,W,2,DV.white);                     // touchline
    for(let i=-1;i<W/40+1;i++){ const o=i*40-(sc%40); px(ctx,o,GROUND-1,2,5,DV.white); } // hash marks
    if(g){ g.obs.forEach(o=>drawDiver(ctx,o)); drawPlayer(ctx, g.p.feet, g.p.onGround, g.p.legFrame); }
    else { drawPlayer(ctx, GROUND, true, 0); }
  }

  function update(dt){
    const g=m.current;
    g.speed = Math.min(SPDMAX, g.speed + ACCEL*dt);
    g.dist += g.speed*dt;
    g.scroll += g.speed*dt; g.bgScroll += g.speed*0.25*dt;
    const p=g.p;
    p.vy += GRAV*dt; p.feet += p.vy*dt;
    if(p.feet>=GROUND){ p.feet=GROUND; p.vy=0; p.onGround=true; } else p.onGround=false;
    if(p.onGround){ p.legT+=dt; if(p.legT>0.1){ p.legT=0; p.legFrame^=1; } }
    g.spawnDist -= g.speed*dt;
    if(g.spawnDist<=0){ g.obs.push(makeObstacle(g.speed)); g.spawnDist = nextGap(g.speed); }
    g.obs.forEach(o=>{ o.x -= g.speed*dt; o.t += dt; });
    g.obs = g.obs.filter(o=>o.x + o.w > -12);
    // collision (forgiving insets)
    const pl=PX+3, pr=PX+PW-3, pt=p.feet-PH+2, pb=p.feet-1;
    for(const o of g.obs){
      const ol=o.x+2, or=o.x+o.w-2, ot=GROUND-o.h+2, ob=GROUND-1;
      if(pr>ol && pl<or && pb>ot && pt<ob){ gameOver(); return; }
    }
    const si=Math.floor(g.dist/12);
    if(si!==g.scoreInt){ g.scoreInt=si; setScore(si); }
  }

  function frame(ts){
    const g=m.current; if(!g || g.phase!=="run") return;
    if(!g.last) g.last=ts;
    let dt=(ts-g.last)/1000; g.last=ts; if(dt>0.05) dt=0.05;
    update(dt);
    if(m.current && m.current.phase!=="run") return; // gameOver may have fired
    render();
    raf.current=requestAnimationFrame(frame);
  }

  function start(){
    m.current=fresh(); setScore(0); setPhase("run");
    cancelAnimationFrame(raf.current); raf.current=requestAnimationFrame(frame);
  }
  function gameOver(){
    const g=m.current; g.phase="over";
    overTxt.current=["PENALTY GIVEN!","HE WENT DOWN!","GROSSO WINS IT!","REF POINTS TO THE SPOT!"][Math.floor(Math.random()*4)];

    savedRef.current=false; setSaved(false); setNameInput("");
    const sc=g.scoreInt, list=scoresRef.current;
    awaitingRef.current = sc>0 && (list.length<5 || sc>list[list.length-1].score);
    setPhase("over"); render();
  }
  function input(){
    const g=m.current;
    if(!g || g.phase==="ready"){ start(); return; }
    if(g.phase==="over"){ if(!awaitingRef.current) start(); return; } // wait for name entry
    if(g.phase==="run" && g.p.onGround){ g.p.vy=JUMP; g.p.onGround=false; }
  }

  React.useEffect(()=>{
    render();
    fetch("/api/scores?game=divers").then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>{ if(d&&Array.isArray(d.scores)){ setOnline(true); setScores(d.scores);
        try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(d.scores)); }catch(e){} } })
      .catch(()=>setOnline(false));
    const onKey=(e)=>{
      if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
      if(e.key===" "||e.key==="ArrowUp"||e.key==="Enter"){ e.preventDefault(); input(); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>{ window.removeEventListener("keydown",onKey); cancelAnimationFrame(raf.current); };
  },[]);

  const qualifies = score>0 && (scores.length<5 || score>scores[scores.length-1].score);
  async function saveScore(){
    awaitingRef.current=false;
    const nm=(nameInput.trim()||"YOU").toUpperCase().slice(0,10);
    const sc=score;
    savedRef.current=true; setSaved(true); setNameInput("");
    if(online){

        if(r.ok){ const d=await r.json();
          if(d&&Array.isArray(d.scores)){ setScores(d.scores);
            try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(d.scores)); }catch(e){} return; } }
      }catch(e){}
    }

    setScores(next);
    try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(next)); }catch(e){}
  }

  return (

        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:DV.gold}}>SCORE <b style={{color:C.text}}>{score}</b></span>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:1,color:C.text,textAlign:"center",lineHeight:1}}>DIVERS<br/><span style={{fontSize:11,color:C.sub,letterSpacing:.5}}>NEILL v GROSSO</span></span>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.sub}}>BEST <b style={{color:DV.good}}>{best}</b></span>
      </div>

      <div className="relative mx-auto" style={{width:"100%",maxWidth:480}}>
        <canvas ref={cvs} width={W} height={H}
          onPointerDown={(e)=>{ e.preventDefault(); input(); }}
          style={{width:"100%",height:"auto",imageRendering:"pixelated",borderRadius:8,
            border:"2px solid "+C.line, background:DV.sky, display:"block", cursor:"pointer", touchAction:"manipulation"}}/>
        {phase==="ready" && (

            <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.sub}}>TAP / SPACE TO HOP THE DIVE</div>

                <div className="flex items-center gap-4">

                  <button onClick={(e)=>{ e.stopPropagation(); awaitingRef.current=false; savedRef.current=true; setSaved(true); }}

                <button onClick={(e)=>{ e.stopPropagation(); start(); }}
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:DV.ink,background:DV.gold,
                    border:"0",borderRadius:6,padding:"12px 18px",cursor:"pointer",boxShadow:"0 3px 0 "+DV.goldDk}}>PLAY ON ▶</button>

const GROUP_OF = {};

const groupOfApi = n => GROUP_OF[apiTeamName(n)] || null;
// lineups: fetch-once-cache per fixture (empty results are re-fetched as kickoff nears)
const LINEUP_CACHE = {};
async function getLineup(id){
  const c=LINEUP_CACHE[id];
  if(c && c.length) return c;
  const d = await fbFetch("/fixtures/lineups",{fixture:id}).catch(()=>[]);
  LINEUP_CACHE[id]=d; return d;
}
function prefetchSoon(fixtures){
  const now=Date.now()/1000;
  (fixtures||[]).filter(f=>f.fixture.timestamp>now-2*3600 && f.fixture.timestamp<now+30*3600).slice(0,12).forEach(f=>getLineup(f.fixture.id));
}
// predictions (h2h is real pre-match; win%/comparison sharpen once games are played)
const PREDICT_CACHE = {};
async function getPrediction(id){
  if(PREDICT_CACHE[id]) return PREDICT_CACHE[id];
  const d = await fbFetch("/predictions",{fixture:id}).catch(()=>[]);
  PREDICT_CACHE[id]=d; return d;
}
const pctNum = s => s ? (parseFloat(s)||0) : 0;

async function getSquad(teamId){ if(SQUAD_CACHE[teamId]) return SQUAD_CACHE[teamId]; const d=await fbFetch("/players/squads",{team:teamId}).catch(()=>[]); SQUAD_CACHE[teamId]=d; return d; }
const CLUB_CACHE={};
async function getPlayerClub(id){
  if(CLUB_CACHE[id]!==undefined) return CLUB_CACHE[id];
  const arr=await fbFetch("/players",{id:id,season:2025}).catch(()=>[]);
  const stats=(arr[0]&&arr[0].statistics)||[];
  let best=null;
  stats.forEach(s=>{ if(s.league && s.league.country && s.league.country!=="World" && s.team){ const ap=(s.games&&s.games.appearences)||0; if(!best||ap>best.ap) best={ap:ap,team:s.team}; } });
  const club=best?{name:best.team.name,logo:best.team.logo}:null;
  CLUB_CACHE[id]=club; return club;
}
async function getOdds(fixtureId){ if(ODDS_CACHE[fixtureId]) return ODDS_CACHE[fixtureId]; const d=await fbFetch("/odds",{fixture:fixtureId}).catch(()=>[]); ODDS_CACHE[fixtureId]=d; return d; }
function resultOf(f, teamId){
  const st=f.fixture.status.short; if(["FT","AET","PEN"].indexOf(st)<0) return null;
  if(f.goals.home==null||f.goals.away==null) return null;
  const home=f.teams.home.id===teamId, gf=home?f.goals.home:f.goals.away, ga=home?f.goals.away:f.goals.home;
  return { r: gf>ga?"W":(gf<ga?"L":"D"), gf:gf, ga:ga, opp:(home?f.teams.away:f.teams.home), date:f.fixture.date };
}

function fbStatus(st){
  const s=st.short;
  if(["1H","2H","ET","BT","P","LIVE"].includes(s)) return {live:true,label:st.elapsed?(st.elapsed+"'"):"LIVE"};
  if(s==="HT") return {live:true,label:"HT"};
  if(["FT","AET","PEN"].includes(s)) return {done:true,label:s==="PEN"?"PENS":"FT"};
  if(["PST","CANC","ABD","SUSP","INT"].includes(s)) return {label:s};
  return {ns:true,label:null};
}

function shortName(n){ if(!n) return ""; const p=String(n).trim().split(" "); return p.length>1?p[p.length-1]:p[0]; }
function PitchXI({side,accent}){
  const xi=side.startXI||[];

      <div className="flex items-center gap-2" style={{padding:"8px 10px",background:C.panel}}>

          {(()=>{ const rows={}; let maxR=1;
            xi.forEach(p=>{ const gp=p.player.grid.split(":"); const r=+gp[0]; (rows[r]=rows[r]||[]).push(Object.assign({},p.player,{col:+gp[1]})); maxR=Math.max(maxR,r); });
            const out=[];
            Object.keys(rows).forEach(rk=>{ const r=+rk; const ps=rows[r].sort((a,b)=>a.col-b.col); const n=ps.length;
              const top = 8 + (maxR>1?(1-(r-1)/(maxR-1)):0)*84;
              ps.forEach((p,i)=>{ const left=(i+1)/(n+1)*100;
                out.push(
                  <div key={r+"-"+i} style={{position:"absolute",left:left+"%",top:top+"%",transform:"translate(-50%,-50%)",textAlign:"center",width:48}}>
                    <div style={{width:22,height:22,margin:"0 auto",borderRadius:"50%",background:accent,color:C.ink,fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{p.number}</div>

          })()}
        </div>

        <div style={{padding:"8px 10px"}}>{xi.map((p,i)=><div key={i} style={{fontSize:12,color:C.text}}>{p.player.number} {p.player.name} <span style={{color:C.dim,fontSize:10}}>{p.player.pos}</span></div>)}</div>

        </div>}
    </div>
  );

        ::-webkit-scrollbar{height:8px;width:8px}
        ::-webkit-scrollbar-thumb{background:#2a3650;border-radius:8px}
      `}</style>
      <div style={{maxWidth:960,margin:"0 auto",padding:"24px 16px 56px"}}>
        {/* header */}
        <div className="flex items-end justify-between flex-wrap gap-3 mb-1">
          <div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:44,lineHeight:.95,letterSpacing:1,color:C.text}}>
              WORLD CUP <span style={{color:C.gold}}>2026</span>
            </div>
            <div style={{fontSize:13,color:C.sub,marginTop:2}}>Sweepstakes draft · Canada · Mexico · USA · 11 Jun – 19 Jul · times in AEST</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:30,color:C.gold,lineHeight:1}}>48</div>
            <div style={{fontSize:10,color:C.dim,letterSpacing:1}}>TEAMS · 104 MATCHES</div>
          </div>
        </div>

        {/* main tabs */}
        <div className="flex gap-2 mt-5 mb-6">
          {[["live","Live"],["leaderboard","Leaderboard"],["penalty","Penalties"],["divers","Divers"]].map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)} className="rounded-xl font-bold transition flex-1 sm:flex-none"
              style={{padding:"10px 22px",fontSize:14,letterSpacing:.4,
                background:tab===id?C.gold:C.card, color:tab===id?C.ink:C.text,
                border:"1px solid "+(tab===id?"transparent":C.line)}}>{lbl}</button>
          ))}
        </div>

        {tab==="live"&&<Live/>}
        {tab==="leaderboard"&&<Leaderboard/>}
        {tab==="penalty"&&<Penalty/>}
        {tab==="divers"&&<Divers/>}

        <div style={{marginTop:40,paddingTop:16,borderTop:"1px solid "+C.lineSoft,fontSize:11,color:C.dim}}>
          Kick-offs converted to AEST (no daylight saving Jun/Jul) and subject to FIFA confirmation ·
          Round-of-32 third-place opponents resolve once the group stage finishes.
        </div>
      </div>
    </div>
  );
}


/* ---- load hosted JSON if present (same folder), else use embedded copy ---- */
function mount(){ ReactDOM.createRoot(document.getElementById("root")).render(<App/>); }
fetch("./sweepstakes.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { DATA = j; })
  .catch(() => {})            // keep embedded fallback
  .finally(mount);

</script>
</body>
