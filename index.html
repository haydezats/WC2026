function fmt(iso, kind){
  const d = new Date(iso);
  const tz = "Australia/Sydney";
  if(kind==="dayKey") return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  if(kind==="dayLabel") return new Intl.DateTimeFormat("en-GB",{timeZone:tz,weekday:"short",day:"numeric",month:"short"}).format(d);
  if(kind==="time") return new Intl.DateTimeFormat("en-AU",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true}).format(d).replace(/\s/,"").toLowerCase();
  return iso;
}

/* ---------- scoring engine (ready for when results + draft land) ---------- */
function teamStats(){
  const s = {};
  const bump = (t,tp,gf,ga)=>{ if(!s[t]) s[t]={tp:0,gf:0,ga:0,p:0}; s[t].tp+=tp; s[t].gf+=gf; s[t].ga+=ga; s[t].p+=1; };
  DATA.groupFixtures.forEach(m=>{
    const r=m.result; if(!r||!r.played) return;
    const h=r.homeGoals, a=r.awayGoals;
    bump(m.home, h>a?3:h===a?1:0, h, a);
    bump(m.away, a>h?3:h===a?1:0, a, h);
  });
  DATA.knockout.rounds.forEach(rd=>rd.matches.forEach(m=>{
    const r=m.result; if(!r||!r.played) return;
    const hT=r.homeTeam||(m.home&&m.home.team), aT=r.awayTeam||(m.away&&m.away.team);
    if(!hT||!aT) return;
    const h=r.homeGoals, a=r.awayGoals;
    if(r.penalties){ bump(hT,1,h,a); bump(aT,1,a,h); }
    else { bump(hT, h>a?3:1, h, a); bump(aT, a>h?3:1, a, h); }
  }));
  return s;
}
function champion(){
  const fin = DATA.knockout.rounds.find(r=>r.round==="Final");
  if(!fin) return null; const m=fin.matches[0]; const r=m.result;
  if(!r||!r.played) return null;
  return r.winner==="away" ? (r.awayTeam) : (r.homeTeam);
}
function linearAlloc(members, metric, asc, max){
  // returns map memberIdx->points, tie-aware linear from max..0
  const N=members.length; if(N<=1) return members.map(()=>max);
  const idx=members.map((_,i)=>i).sort((x,y)=>asc?metric[x]-metric[y]:metric[y]-metric[x]);
  const v=i=>max*(N-1-i)/(N-1);
  const pts=Array(N).fill(0); let i=0;
  while(i<N){ let j=i; while(j+1<N && metric[idx[j+1]]===metric[idx[i]]) j++;
    let avg=0; for(let k=i;k<=j;k++) avg+=v(k); avg/=(j-i+1);
    for(let k=i;k<=j;k++) pts[idx[k]]=avg; i=j+1; }
  return pts;
}
function standings(){
  const ts=teamStats(); const champ=champion();
  const anyPlayed=Object.keys(ts).length>0;
  const drafted=DATA.members.some(m=>m.teams.length>0);
  const rows=DATA.members.map(m=>{
    let tp=0,gf=0,ga=0; m.teams.forEach(t=>{ if(ts[t]){tp+=ts[t].tp;gf+=ts[t].gf;ga+=ts[t].ga;} });
    return {name:m.name, teams:m.teams, tp, gf, ga, hasChamp: champ&&m.teams.includes(champ)};
  });
  const live = anyPlayed && drafted;
  let alloc={tp:rows.map(()=>0),gf:rows.map(()=>0),ga:rows.map(()=>0)};
  if(live){
    alloc.tp=linearAlloc(rows,rows.map(r=>r.tp),false,30);
    alloc.gf=linearAlloc(rows,rows.map(r=>r.gf),false,15);
    alloc.ga=linearAlloc(rows,rows.map(r=>r.ga),true,15);
  }
  rows.forEach((r,i)=>{ r.pChamp=r.hasChamp?40:0; r.pTp=alloc.tp[i]; r.pGf=alloc.gf[i]; r.pGa=alloc.ga[i];
    r.total=r.pChamp+r.pTp+r.pGf+r.pGa; });
  rows.sort((a,b)=>b.total-a.total);
  return {rows, live, champ};
}

              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:i===0&&live?C.gold:C.sub}}>{i+1}</div>
              <div style={{fontSize:14,fontWeight:700,color:C.text}}>{r.name}</div>
              <div style={{textAlign:"center",fontSize:13,color:r.hasChamp?C.gold:C.dim}}>{live?(r.hasChamp?"40":"0"):"—"}</div>
              <div style={{textAlign:"center",fontSize:13,color:C.text}}>{live?r.pTp.toFixed(0):"—"}</div>
              <div style={{textAlign:"center",fontSize:13,color:C.text}}>{live?r.pGf.toFixed(0):"—"}</div>
              <div style={{textAlign:"center",fontSize:13,color:C.text}}>{live?r.pGa.toFixed(0):"—"}</div>
              <div style={{textAlign:"right",fontFamily:"'Bebas Neue',sans-serif",fontSize:22,color:i===0&&live?C.gold:C.text}}>{live?r.total.toFixed(0):"—"}</div>
            </div>
            <div className="flex flex-wrap gap-1.5 mt-2">
              {r.teams.length? r.teams.map(t=>(
                <span key={t} className="rounded-md px-2 py-0.5" style={{background:C.ink,border:"1px solid "+C.lineSoft,fontSize:12,color:C.text}}>{flag(t)} {t}</span>
              )) : Array.from({length:6}).map((_,k)=>(

              ))}

      <div style={{fontSize:11,color:C.dim,lineHeight:1.5}}>
        Raw tallies (stable goals for/against and W-D points) drive three ranked categories; the top stable in each
        takes the full 30 / 15 / 15 and the rest scale down by rank. Champion is a flat 40 to whoever owns the Cup winner.
        Tweak the allocation method anytime — it's a single setting in the data.
      </div>
    </div>
  );
}

/* ---------- 8-bit Penalty Shootout (arcade tab) ---------- */
const PEN = {
  sky:"#241734", stand:"#3a2a55", stand2:"#2c1f44", grass:"#2f9e44", grass2:"#268a3a",
  post:"#f4f7ff", net:"#9aa6c4", ball:"#ffffff", ink:"#0b0f17",
  kit:"#E8B23A", kit2:"#b97f12", skin:"#f1c27d", glove:"#F0697D",
  goldT:"#E8B23A", good:"#3FD08B", bad:"#F0697D"
};
function Penalty(){
  const W=240, H=180;
  const ZONES = [
    {id:0, label:"↖", tx:72,  ty:60,  gx:74,  gy:66 },
    {id:1, label:"↗", tx:168, ty:60,  gx:166, gy:66 },
    {id:2, label:"⦿", tx:120, ty:76,  gx:120, gy:86 },
    {id:3, label:"↙", tx:74,  ty:104, gx:76,  gy:100},
    {id:4, label:"↘", tx:166, ty:104, gx:164, gy:100},
  ];
  const cvs   = React.useRef(null);
  const raf   = React.useRef(0);
  const timers= React.useRef([]);
  const g = React.useRef({
    phase:"aim", t:0, start:0, player:0, keeperZ:2,
    bx:120, by:150, kx:120, ky:92,
    streak:0, best:Number(localStorage.getItem("wc26_pen_best")||0),
    msg:"TAP A ZONE", res:null
  });
  const [ui,setUi] = React.useState({streak:0, best:g.current.best, phase:"aim", msg:"TAP A ZONE", res:null});
  const sync=()=>{ const m=g.current; setUi({streak:m.streak,best:m.best,phase:m.phase,msg:m.msg,res:m.res}); };
  const [scores,setScores] = React.useState(()=>{ try{ return JSON.parse(localStorage.getItem("wc26_pen_scores")||"[]"); }catch(e){ return []; } });
  const [nameInput,setNameInput] = React.useState("");
  const [saved,setSaved] = React.useState(false);
  const [online,setOnline] = React.useState(false);

  const lerp=(a,b,t)=>a+(b-a)*t;
  const easeOut=t=>1-Math.pow(1-t,2);
  const px=(ctx,x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); };

  function drawKeeper(ctx,cx,cy,dive){
    const k=PEN.kit, k2=PEN.kit2, gl=PEN.glove, sk=PEN.skin;
    px(ctx,cx-5,cy+6,4,8,k2); px(ctx,cx+1,cy+6,4,8,k2);   // legs
    px(ctx,cx-6,cy-8,12,16,k); px(ctx,cx-6,cy-8,12,3,k2); // body
    px(ctx,cx-4,cy-16,8,8,sk); px(ctx,cx-4,cy-16,8,2,PEN.ink); // head
    if(dive===0){
      px(ctx,cx-9,cy-14,3,10,k);  px(ctx,cx+6,cy-14,3,10,k);
      px(ctx,cx-10,cy-18,5,5,gl); px(ctx,cx+6,cy-18,5,5,gl);
    } else {
      const s=dive;
      px(ctx, s>0?cx+5:cx-8,  cy-6, 3,12, k);
      px(ctx, s>0?cx+8:cx-13, cy+4, 6,6,  gl);
      px(ctx, s>0?cx-9:cx+6,  cy-2, 3,8,  k);
      px(ctx, s>0?cx-11:cx+8, cy+2, 5,5,  gl);
    }
  }

  function draw(){
    const ctx = cvs.current && cvs.current.getContext("2d"); if(!ctx) return;
    const m=g.current;
    px(ctx,0,0,W,H,PEN.sky);
    for(let i=0;i<W;i+=8){ px(ctx,i,8,6,4,(i/8)%2?PEN.stand:PEN.stand2); px(ctx,i+2,16,4,3,(i/8)%2?PEN.stand2:PEN.stand); }
    px(ctx,0,120,W,H-120,PEN.grass);
    for(let i=0;i<W;i+=16) px(ctx,i,120,8,H-120,PEN.grass2);
    px(ctx,40,40,W-80,4,PEN.post);  // crossbar
    px(ctx,40,40,4,82,PEN.post);    // left post
    px(ctx,196,40,4,82,PEN.post);   // right post
    ctx.fillStyle=PEN.net;
    for(let x=46;x<196;x+=10) ctx.fillRect(x,44,1,76);
    for(let y=46;y<120;y+=10) ctx.fillRect(44,y,152,1);
    px(ctx,118,150,4,2,PEN.post);   // penalty spot
    if(m.phase==="aim"){
      ZONES.forEach((z,i)=>{
        const on=i===m.player;
        px(ctx,z.tx-5,z.ty-5,10,10,on?PEN.goldT:"#ffffff22");
        px(ctx,z.tx-3,z.ty-3,6,6,PEN.sky);
        px(ctx,z.tx-1,z.ty-1,2,2,on?PEN.goldT:PEN.net);
      });
    }
    const dive = m.phase==="aim" ? 0 : (Math.abs(m.kx-120)<6 ? 0 : (m.kx>120?1:-1));
    drawKeeper(ctx,m.kx,m.ky,dive);
    px(ctx,m.bx-4,m.by-4,8,8,PEN.ball);
    px(ctx,m.bx-4,m.by-4,8,1,PEN.ink);
    px(ctx,m.bx-4,m.by+3,8,1,PEN.ink);
    px(ctx,m.bx-1,m.by-2,2,2,PEN.ink);
  }

  function resolve(){
    const m=g.current;
    const saved=(m.keeperZ===m.player) && (Math.random()>0.12);
    if(saved){
      m.res="SAVED"; m.phase="over"; m.msg="SAVED!";
      if(m.streak>m.best){ m.best=m.streak; localStorage.setItem("wc26_pen_best",String(m.best)); }
    } else {
      m.res="GOAL"; m.streak+=1; m.msg=["GOAL!","TOP BINS!","GOLAZO!","SCORED!"][m.streak%4];
      const t=setTimeout(()=>{
        const mm=g.current;
        mm.phase="aim"; mm.res=null; mm.t=0; mm.bx=120; mm.by=150; mm.kx=120; mm.ky=92; mm.msg="TAP A ZONE";
        draw(); sync();
      },820);
      timers.current.push(t);
    }
    draw(); sync();
  }

  function step(ts){
    const m=g.current;
    if(!m.start) m.start=ts;
    m.t=Math.min(1,(ts-m.start)/620);
    const z=ZONES[m.player];
    m.bx=lerp(120,z.tx,easeOut(m.t));
    m.by=lerp(150,z.ty,easeOut(m.t));
    const kz=ZONES[m.keeperZ];
    const kt=Math.max(0,(m.t-0.06)/0.94);
    m.kx=lerp(120,kz.gx,easeOut(kt));
    m.ky=lerp(92,kz.gy,easeOut(kt));
    draw();
    if(m.t<1) raf.current=requestAnimationFrame(step);
    else resolve();
  }

  function shoot(zoneId){
    const m=g.current;
    if(m.phase!=="aim") return;
    m.player=zoneId;
    const pSmart=Math.min(0.18+m.streak*0.045,0.72);   // keeper reads you better as the streak grows
    m.keeperZ = Math.random()<pSmart ? zoneId : Math.floor(Math.random()*5);
    m.phase="kick"; m.t=0; m.start=0; m.res=null; m.msg="…";
    sync();
    raf.current=requestAnimationFrame(step);
  }

  function retry(){
    const m=g.current;
    m.phase="aim"; m.t=0; m.res=null; m.streak=0;
    m.bx=120; m.by=150; m.kx=120; m.ky=92; m.player=0; m.msg="TAP A ZONE";
    setSaved(false); setNameInput("");
    draw(); sync();
  }

  React.useEffect(()=>{
    draw(); sync();
    fetch("/api/scores?game=penalty").then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>{ if(d&&Array.isArray(d.scores)){ setOnline(true); setScores(d.scores);
        try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(d.scores)); }catch(e){} } })
      .catch(()=>setOnline(false));
    const onKey=(e)=>{
      if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
      if(g.current.phase==="over" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); retry(); return; }
      const map={"q":0,"e":1,"s":2," ":2,"z":3,"c":4,"7":0,"9":1,"5":2,"1":3,"3":4};
      const k=e.key.toLowerCase();
      if(k in map){ e.preventDefault(); shoot(map[k]); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>{ window.removeEventListener("keydown",onKey); cancelAnimationFrame(raf.current); timers.current.forEach(clearTimeout); };
  },[]);

  const PadBtn=({id,label})=>(
    <button onClick={()=>shoot(id)} disabled={ui.phase!=="aim"}
      style={{width:"100%",fontFamily:"'Press Start 2P',monospace",fontSize:9,lineHeight:1.5,
        color:ui.phase==="aim"?C.text:C.dim, background:C.panel2,
        border:"2px solid "+(ui.phase==="aim"?PEN.goldT:C.line), borderRadius:8,
        padding:"12px 6px", cursor:ui.phase==="aim"?"pointer":"default",
        boxShadow:ui.phase==="aim"?"0 3px 0 "+PEN.kit2:"none", touchAction:"manipulation"}}>{label}</button>
  );

  const qualifies = ui.streak>0 && (scores.length<5 || ui.streak>scores[scores.length-1].score);
  async function saveScore(){
    const nm=(nameInput.trim()||"YOU").toUpperCase().slice(0,10);
    const sc=g.current.streak;
    setSaved(true); setNameInput("");
    if(online){
      try{
        const r=await fetch("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({game:"penalty",name:nm,score:sc})});
        if(r.ok){ const d=await r.json();
          if(d&&Array.isArray(d.scores)){ setScores(d.scores);
            try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(d.scores)); }catch(e){}
            return; } }
      }catch(e){}
    }
    const next=[...scores,{name:nm,score:sc}].sort((a,b)=>b.score-a.score).slice(0,5);
    setScores(next);
    try{ localStorage.setItem("wc26_pen_scores",JSON.stringify(next)); }catch(e){}
  }

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-3 flex items-center justify-between" style={{background:C.card,border:"1px solid "+C.lineSoft}}>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.goldT}}>STREAK <b style={{color:C.text}}>{ui.streak}</b></span>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:1.5,color:C.text}}>PENALTY DASH</span>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.sub}}>BEST <b style={{color:PEN.good}}>{ui.best}</b></span>
      </div>

      <div className="relative mx-auto" style={{width:"100%",maxWidth:360}}>
        <canvas ref={cvs} width={W} height={H}
          style={{width:"100%",height:"auto",imageRendering:"pixelated",borderRadius:8,
            border:"2px solid "+C.line, background:PEN.sky, display:"block", touchAction:"manipulation"}}/>
        {ui.phase==="aim" && ZONES.map(z=>(
          <button key={z.id} onClick={()=>shoot(z.id)} aria-label={"Shoot "+z.label}
            style={{position:"absolute",left:(z.tx/W*100)+"%",top:(z.ty/H*100)+"%",
              transform:"translate(-50%,-50%)",width:"26%",height:"30%",
              background:"transparent",border:"0",cursor:"pointer",touchAction:"manipulation"}}/>
        ))}
        {ui.res && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:16,
              color:ui.res==="GOAL"?PEN.good:PEN.bad,textShadow:"2px 2px 0 "+PEN.ink}}>{ui.msg}</div>
          </div>
        )}
        {ui.phase==="over" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3"
            style={{background:"rgba(8,12,22,.88)",borderRadius:8,padding:12}}>
            {qualifies && !saved ? (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:PEN.goldT,textShadow:"2px 2px 0 "+PEN.ink}}>NEW TOP 5!</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.sub}}>STREAK {ui.streak} — ENTER NAME</div>
                <input value={nameInput} onChange={e=>setNameInput(e.target.value)} maxLength={10} autoFocus
                  onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); saveScore(); } }}
                  placeholder="YOUR NAME"
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,textAlign:"center",textTransform:"uppercase",
                    color:C.text,background:PEN.ink,border:"2px solid "+PEN.goldT,borderRadius:6,padding:"10px 8px",width:"78%",maxWidth:220,outline:"none"}}/>
                <div className="flex items-center gap-4">
                  <button onClick={saveScore}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.ink,background:PEN.goldT,
                      border:"0",borderRadius:6,padding:"10px 16px",cursor:"pointer",boxShadow:"0 3px 0 "+PEN.kit2}}>SAVE ✓</button>
                  <button onClick={()=>setSaved(true)}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.dim,background:"transparent",border:"0",cursor:"pointer"}}>SKIP</button>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:14,color:saved?PEN.good:PEN.bad,textShadow:"2px 2px 0 "+PEN.ink}}>{saved?"ON THE BOARD!":"SAVED!"}</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:C.sub}}>STREAK {ui.streak} · BEST {ui.best}</div>
                <button onClick={retry}
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:PEN.ink,background:PEN.goldT,
                    border:"0",borderRadius:6,padding:"12px 18px",cursor:"pointer",boxShadow:"0 3px 0 "+PEN.kit2}}>RETRY ▶</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      <div className="grid mx-auto" style={{width:"100%",maxWidth:360,gridTemplateColumns:"1fr 1fr",gap:8}}>
        <PadBtn id={0} label="↖ TOP LEFT"/>
        <PadBtn id={1} label="TOP RIGHT ↗"/>
        <div style={{gridColumn:"1 / -1"}}><PadBtn id={2} label="⦿ DOWN THE MIDDLE"/></div>
        <PadBtn id={3} label="↙ LOW LEFT"/>
        <PadBtn id={4} label="LOW RIGHT ↘"/>
      </div>

      <div className="rounded-xl overflow-hidden mx-auto" style={{width:"100%",maxWidth:360,border:"1px solid "+C.lineSoft}}>
        <div style={{background:C.panel,padding:"10px 12px",textAlign:"center"}}>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:PEN.goldT,letterSpacing:.5}}>★ TOP 5 · PENALTY KINGS ★</div>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:online?PEN.good:C.dim,marginTop:6,letterSpacing:.5}}>{online?"GLOBAL · LIVE":"THIS DEVICE"}</div>
        </div>
        {scores.length===0 ? (
          <div style={{fontSize:12,color:C.dim,textAlign:"center",padding:"16px 12px",background:C.card}}>No scores yet — set a streak and put your name up.</div>
        ) : scores.map((s,i)=>(
          <div key={i} className="flex items-center justify-between" style={{padding:"10px 12px",background:i%2?C.panel2:C.card,borderTop:"1px solid "+C.lineSoft}}>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:i===0?PEN.goldT:C.sub,minWidth:34}}>{["1ST","2ND","3RD","4TH","5TH"][i]}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.text,flex:1,padding:"0 10px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:i===0?PEN.good:C.text}}>{s.score}</span>
          </div>
        ))}
      </div>

      <div style={{fontSize:12,color:C.dim,lineHeight:1.5,textAlign:"center"}}>
        Tap a corner of the goal — or a button — to shoot. The keeper guesses a side; score to build your streak,
        one save ends the run. The keeper reads you better the longer you last. <span style={{color:C.sub}}>Desktop: Q/E top · Z/C bottom · S centre · Enter to retry.</span>
      </div>
    </div>
  );
}

/* ---------- Divers: Neill v Grosso (skill endless-runner tab) ---------- */
function Divers(){
  const W=320, H=150, GROUND=124, PX=40, PW=14, PH=22;
  const GRAV=1100, JUMP=-360, SPD0=150, ACCEL=7, SPDMAX=330;
  const DV = { gold:"#E8B23A", goldDk:"#b97f12", blue:"#2f6fe0", blueDk:"#1f4fa8",
    skin:"#f1c27d", navy:"#16223c", white:"#f4f7ff", sky:"#1b2740", sky2:"#101a30",
    stand:"#26344f", crowd:"#3a4a6a", grass:"#2f9e44", grass2:"#268a3a", ink:"#0b0f17",
    band:"#F0697D", good:"#3FD08B", bad:"#F0697D" };
  const cvs=React.useRef(null), raf=React.useRef(0);
  const m=React.useRef(null);
  const overTxt=React.useRef("PENALTY GIVEN!");
  const savedRef=React.useRef(false);
  const awaitingRef=React.useRef(false);
  const initScores=(()=>{ try{ return JSON.parse(localStorage.getItem("wc26_divers_scores")||"[]"); }catch(e){ return []; } })();
  const scoresRef=React.useRef(initScores);
  const [phase,setPhase]=React.useState("ready");
  const [score,setScore]=React.useState(0);
  const [best,setBest]=React.useState(Number(localStorage.getItem("wc26_divers_best")||0));
  const [scores,setScoresState]=React.useState(initScores);
  const [nameInput,setNameInput]=React.useState("");
  const [saved,setSaved]=React.useState(false);
  const [online,setOnline]=React.useState(false);
  const setScores=(v)=>{ scoresRef.current=v; setScoresState(v); };

  const px=(ctx,x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); };

  function fresh(){
    return { phase:"run", last:0, speed:SPD0, dist:0, scoreInt:0,
      scroll:0, bgScroll:0,
      p:{ feet:GROUND, vy:0, onGround:true, legT:0, legFrame:0 },
      obs:[], spawnDist:300 };
  }

  function makeObstacle(speed){
    const tall = Math.random()<0.32;
    const h = tall ? 26+Math.random()*8 : 14+Math.random()*8;   // swan dive vs low slide
    const w = tall ? 16+Math.random()*8 : 22+Math.random()*16;  // dives narrower, slides longer
    return { x:W+8, w:w, h:h, t:Math.random()*6, tall:tall };
  }
  // Heavily varied spacing: occasional tight back-to-backs, normal spread, and long breathers.
  function nextGap(speed){
    const base = 120 + speed*0.32;            // minimum clearance, scales with pace (stays fair)
    const r = Math.random();
    let extra;
    if(r<0.18)      extra = 10 + Math.random()*45;    // tight
    else if(r<0.80) extra = 70 + Math.random()*185;   // normal
    else            extra = 235 + Math.random()*265;  // long breather
    return base + extra;
  }

  function drawPlayer(ctx, feet, onGround, frame){
    const x=PX, top=feet-PH;
    px(ctx, x-2, GROUND-1, PW+4, 2, "rgba(0,0,0,.28)"); // shadow
    px(ctx, x+3, top-7, 7,7, DV.skin);                  // head
    px(ctx, x+3, top-7, 7,2, DV.ink);                   // hair
    px(ctx, x+1, top, 11,12, DV.gold);                  // jersey
    px(ctx, x+1, top, 11,3, DV.goldDk);
    px(ctx, x+1, top+3, 3,2, DV.band);                  // captain's armband
    px(ctx, x+2, top+12, 9,4, DV.navy);                 // shorts
    px(ctx, x+11, top+2, 3,6, DV.skin);                 // pumping arm
    if(onGround){
      if(frame===0){ px(ctx, x+2, top+16, 3,6, DV.skin); px(ctx, x+8, top+16, 3,4, DV.skin); }
      else { px(ctx, x+2, top+16, 3,4, DV.skin); px(ctx, x+8, top+16, 3,6, DV.skin); }
    } else { px(ctx, x+2, top+16, 3,5, DV.skin); px(ctx, x+8, top+15, 4,4, DV.skin); }
  }

  function drawDiver(ctx, ob){
    const x=Math.round(ob.x), w=ob.w, h=ob.h, bottom=GROUND, top=bottom-h;
    const wob = Math.round(Math.sin(ob.t*9));
    px(ctx, x, GROUND-1, w, 2, "rgba(0,0,0,.30)");      // ground shadow
    if(ob.tall){
      // theatrical swan dive: arched in the air, head thrown back, arms flung up, trailing leg kicked high
      const cy = top + Math.round(h*0.5) + wob;
      px(ctx, x+w-9, top+2, 4,7, DV.navy);              // kicked-up thigh
      px(ctx, x+w-7, top-2, 3,6, DV.skin);              // kicked-up shin
      px(ctx, x+w-8, top-4, 5,3, DV.ink);               // boot in the air
      px(ctx, x+w-6, cy+2, 4,6, DV.navy);               // falling leg
      px(ctx, x+w-5, cy+8, 3,5, DV.skin);
      px(ctx, x+5, cy-4, w-12, 9, DV.blue);             // arched torso
      px(ctx, x+6, cy-6, w-14, 3, DV.blue);             // chest pushed up
      px(ctx, x+5, cy-4, w-12, 2, DV.blueDk);
      px(ctx, x+1, cy-9, 7,7, DV.skin);                 // head thrown back
      px(ctx, x+1, cy-11, 7,3, DV.ink);                 // hair
      px(ctx, x+2, cy-5, 3,2, DV.ink);                  // open mouth (appeal!)
      px(ctx, x+3, cy-13, 3,6, DV.skin); px(ctx, x+2, cy-15, 4,3, DV.skin); // arm up
      px(ctx, x-3, cy-6, 5,3, DV.skin);  px(ctx, x-5, cy-7, 3,3, DV.skin);  // arm out front
    } else {
      // low slide/sprawl: flung along the turf, arms reaching, one boot up
      const bh = Math.max(7, h-4), bodyTop = bottom-2-bh;
      px(ctx, x+w-10, bottom-7, 6,4, DV.navy);          // shorts
      px(ctx, x+w-4, bottom-6, 4,4, DV.skin); px(ctx, x+w-1, bottom-8, 3,3, DV.ink); // shin + boot
      px(ctx, x+w-8, bottom-11, 3,5, DV.skin);          // raised lower leg
      px(ctx, x+4, bodyTop, w-9, bh, DV.blue);          // long low body
      px(ctx, x+4, bodyTop, w-9, 2, DV.blueDk);
      px(ctx, x, bodyTop-3+wob, 7,7, DV.skin);          // head leading
      px(ctx, x, bodyTop-3+wob, 7,2, DV.ink);           // hair
      px(ctx, x+1, bodyTop+1, 3,2, DV.ink);             // mouth
      px(ctx, x-3, bodyTop+1, 5,3, DV.skin); px(ctx, x-5, bodyTop+1, 3,3, DV.skin); // arm reaching
      px(ctx, x-2, bodyTop-2+wob, 3,3, DV.skin);        // upper hand
    }
    for(let i=1;i<=3;i++) px(ctx, x+w+i*3, top+Math.round(h*0.6), 2,2, "rgba(255,255,255,.22)"); // motion lines
  }

  function render(){
    const ctx = cvs.current && cvs.current.getContext("2d"); if(!ctx) return;
    const g=m.current;
    const bg = g?g.bgScroll:0, sc = g?g.scroll:0;
    px(ctx,0,0,W,H,DV.sky); px(ctx,0,0,W,40,DV.sky2);
    px(ctx,0,40,W,18,DV.stand);                          // stands
    for(let i=0;i<W+10;i+=6){ const o=(i-(bg%6)); px(ctx,o,44,3,3,"#46577a"); px(ctx,o+2,50,2,2,"#37466a"); }
    px(ctx,0,58,W,3,DV.blueDk);                          // advert hoarding
    px(ctx,0,GROUND,W,H-GROUND,DV.grass);                // pitch
    for(let i=-1;i<W/18+1;i++){ const o=i*18-(sc%18); px(ctx,o,GROUND,9,H-GROUND,DV.grass2); }
    px(ctx,0,GROUND-1,W,2,DV.white);                     // touchline
    for(let i=-1;i<W/40+1;i++){ const o=i*40-(sc%40); px(ctx,o,GROUND-1,2,5,DV.white); } // hash marks
    if(g){ g.obs.forEach(o=>drawDiver(ctx,o)); drawPlayer(ctx, g.p.feet, g.p.onGround, g.p.legFrame); }
    else { drawPlayer(ctx, GROUND, true, 0); }
  }

  function update(dt){
    const g=m.current;
    g.speed = Math.min(SPDMAX, g.speed + ACCEL*dt);
    g.dist += g.speed*dt;
    g.scroll += g.speed*dt; g.bgScroll += g.speed*0.25*dt;
    const p=g.p;
    p.vy += GRAV*dt; p.feet += p.vy*dt;
    if(p.feet>=GROUND){ p.feet=GROUND; p.vy=0; p.onGround=true; } else p.onGround=false;
    if(p.onGround){ p.legT+=dt; if(p.legT>0.1){ p.legT=0; p.legFrame^=1; } }
    g.spawnDist -= g.speed*dt;
    if(g.spawnDist<=0){ g.obs.push(makeObstacle(g.speed)); g.spawnDist = nextGap(g.speed); }
    g.obs.forEach(o=>{ o.x -= g.speed*dt; o.t += dt; });
    g.obs = g.obs.filter(o=>o.x + o.w > -12);
    // collision (forgiving insets)
    const pl=PX+3, pr=PX+PW-3, pt=p.feet-PH+2, pb=p.feet-1;
    for(const o of g.obs){
      const ol=o.x+2, or=o.x+o.w-2, ot=GROUND-o.h+2, ob=GROUND-1;
      if(pr>ol && pl<or && pb>ot && pt<ob){ gameOver(); return; }
    }
    const si=Math.floor(g.dist/12);
    if(si!==g.scoreInt){ g.scoreInt=si; setScore(si); }
  }

  function frame(ts){
    const g=m.current; if(!g || g.phase!=="run") return;
    if(!g.last) g.last=ts;
    let dt=(ts-g.last)/1000; g.last=ts; if(dt>0.05) dt=0.05;
    update(dt);
    if(m.current && m.current.phase!=="run") return; // gameOver may have fired
    render();
    raf.current=requestAnimationFrame(frame);
  }

  function start(){
    m.current=fresh(); setScore(0); setPhase("run");
    cancelAnimationFrame(raf.current); raf.current=requestAnimationFrame(frame);
  }
  function gameOver(){
    const g=m.current; g.phase="over";
    overTxt.current=["PENALTY GIVEN!","HE WENT DOWN!","GROSSO WINS IT!","REF POINTS TO THE SPOT!"][Math.floor(Math.random()*4)];
    if(g.scoreInt>best){ setBest(g.scoreInt); try{localStorage.setItem("wc26_divers_best",String(g.scoreInt));}catch(e){} }
    savedRef.current=false; setSaved(false); setNameInput("");
    const sc=g.scoreInt, list=scoresRef.current;
    awaitingRef.current = sc>0 && (list.length<5 || sc>list[list.length-1].score);
    setPhase("over"); render();
  }
  function input(){
    const g=m.current;
    if(!g || g.phase==="ready"){ start(); return; }
    if(g.phase==="over"){ if(!awaitingRef.current) start(); return; } // wait for name entry
    if(g.phase==="run" && g.p.onGround){ g.p.vy=JUMP; g.p.onGround=false; }
  }

  React.useEffect(()=>{
    render();
    fetch("/api/scores?game=divers").then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(d=>{ if(d&&Array.isArray(d.scores)){ setOnline(true); setScores(d.scores);
        try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(d.scores)); }catch(e){} } })
      .catch(()=>setOnline(false));
    const onKey=(e)=>{
      if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
      if(e.key===" "||e.key==="ArrowUp"||e.key==="Enter"){ e.preventDefault(); input(); }
    };
    window.addEventListener("keydown",onKey);
    return ()=>{ window.removeEventListener("keydown",onKey); cancelAnimationFrame(raf.current); };
  },[]);

  const qualifies = score>0 && (scores.length<5 || score>scores[scores.length-1].score);
  async function saveScore(){
    awaitingRef.current=false;
    const nm=(nameInput.trim()||"YOU").toUpperCase().slice(0,10);
    const sc=score;
    savedRef.current=true; setSaved(true); setNameInput("");
    if(online){
      try{
        const r=await fetch("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({game:"divers",name:nm,score:sc})});
        if(r.ok){ const d=await r.json();
          if(d&&Array.isArray(d.scores)){ setScores(d.scores);
            try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(d.scores)); }catch(e){} return; } }
      }catch(e){}
    }
    const next=[...scores,{name:nm,score:sc}].sort((a,b)=>b.score-a.score).slice(0,5);
    setScores(next);
    try{ localStorage.setItem("wc26_divers_scores",JSON.stringify(next)); }catch(e){}
  }

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-3 flex items-center justify-between" style={{background:C.card,border:"1px solid "+C.lineSoft}}>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:DV.gold}}>SCORE <b style={{color:C.text}}>{score}</b></span>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:1,color:C.text,textAlign:"center",lineHeight:1}}>DIVERS<br/><span style={{fontSize:11,color:C.sub,letterSpacing:.5}}>NEILL v GROSSO</span></span>
        <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.sub}}>BEST <b style={{color:DV.good}}>{best}</b></span>
      </div>

      <div className="relative mx-auto" style={{width:"100%",maxWidth:480}}>
        <canvas ref={cvs} width={W} height={H}
          onPointerDown={(e)=>{ e.preventDefault(); input(); }}
          style={{width:"100%",height:"auto",imageRendering:"pixelated",borderRadius:8,
            border:"2px solid "+C.line, background:DV.sky, display:"block", cursor:"pointer", touchAction:"manipulation"}}/>
        {phase==="ready" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-2"
            onPointerDown={(e)=>{ e.preventDefault(); start(); }}
            style={{background:"rgba(8,12,22,.62)",borderRadius:8,cursor:"pointer"}}>
            <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:11,lineHeight:1.6,color:DV.gold,textShadow:"2px 2px 0 "+DV.ink,textAlign:"center",maxWidth:"92%"}}>DIVERS: NEILL V GROSSO</div>
            <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.sub}}>TAP / SPACE TO HOP THE DIVE</div>
          </div>
        )}
        {phase==="over" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3"
            style={{background:"rgba(8,12,22,.85)",borderRadius:8,padding:12}}>
            {qualifies && !saved ? (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:DV.gold,textShadow:"2px 2px 0 "+DV.ink}}>TOP 5 RUN!</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.sub}}>SCORE {score} — ENTER NAME</div>
                <input value={nameInput} onChange={e=>setNameInput(e.target.value)} maxLength={10} autoFocus
                  onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); saveScore(); } }}
                  placeholder="YOUR NAME"
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,textAlign:"center",textTransform:"uppercase",
                    color:C.text,background:DV.ink,border:"2px solid "+DV.gold,borderRadius:6,padding:"10px 8px",width:"78%",maxWidth:220,outline:"none"}}/>
                <div className="flex items-center gap-4">
                  <button onClick={(e)=>{ e.stopPropagation(); saveScore(); }}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:DV.ink,background:DV.gold,
                      border:"0",borderRadius:6,padding:"10px 16px",cursor:"pointer",boxShadow:"0 3px 0 "+DV.goldDk}}>SAVE ✓</button>
                  <button onClick={(e)=>{ e.stopPropagation(); awaitingRef.current=false; savedRef.current=true; setSaved(true); }}
                    style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:C.dim,background:"transparent",border:"0",cursor:"pointer"}}>SKIP</button>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:12,color:DV.bad,textShadow:"2px 2px 0 "+DV.ink}}>{overTxt.current}</div>
                <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:C.sub}}>SCORE {score} · BEST {best}</div>
                <button onClick={(e)=>{ e.stopPropagation(); start(); }}
                  style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:DV.ink,background:DV.gold,
                    border:"0",borderRadius:6,padding:"12px 18px",cursor:"pointer",boxShadow:"0 3px 0 "+DV.goldDk}}>PLAY ON ▶</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      <div className="rounded-xl overflow-hidden mx-auto" style={{width:"100%",maxWidth:480,border:"1px solid "+C.lineSoft}}>
        <div style={{background:C.panel,padding:"10px 12px",textAlign:"center"}}>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:9,color:DV.gold,letterSpacing:.5}}>★ DIVERS · TOP 5 ★</div>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:online?DV.good:C.dim,marginTop:6,letterSpacing:.5}}>{online?"GLOBAL · LIVE":"THIS DEVICE"}</div>
        </div>
        {scores.length===0 ? (
          <div style={{fontSize:12,color:C.dim,textAlign:"center",padding:"16px 12px",background:C.card}}>No runs yet — survive the divers and put your name up.</div>
        ) : scores.map((s,i)=>(
          <div key={i} className="flex items-center justify-between" style={{padding:"10px 12px",background:i%2?C.panel2:C.card,borderTop:"1px solid "+C.lineSoft}}>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:i===0?DV.gold:C.sub,minWidth:34}}>{["1ST","2ND","3RD","4TH","5TH"][i]}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:10,color:C.text,flex:1,padding:"0 10px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</span>
            <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:11,color:i===0?DV.good:C.text}}>{s.score}</span>
          </div>
        ))}
      </div>

      <div style={{fontSize:12,color:C.dim,lineHeight:1.5,textAlign:"center"}}>
        You're in gold (Neill). Blue divers (Grosso) fling themselves across the box — <b style={{color:C.sub}}>tap / Space</b> to hop over them.
        One touch and the ref points to the spot. It only gets faster.
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("schedule");
  return (
    <div style={{minHeight:"100vh",background:
      "radial-gradient(1200px 600px at 20% -10%, #16203a 0%, "+C.ink+" 55%)",color:C.text,
      fontFamily:"'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Press+Start+2P&display=swap');
        *{box-sizing:border-box}
        ::-webkit-scrollbar{height:8px;width:8px}
        ::-webkit-scrollbar-thumb{background:#2a3650;border-radius:8px}
      `}</style>
      <div style={{maxWidth:960,margin:"0 auto",padding:"24px 16px 56px"}}>
        {/* header */}
        <div className="flex items-end justify-between flex-wrap gap-3 mb-1">
          <div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:44,lineHeight:.95,letterSpacing:1,color:C.text}}>
              WORLD CUP <span style={{color:C.gold}}>2026</span>
            </div>
            <div style={{fontSize:13,color:C.sub,marginTop:2}}>Sweepstakes draft · Canada · Mexico · USA · 11 Jun – 19 Jul · times in AEST</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:30,color:C.gold,lineHeight:1}}>48</div>
            <div style={{fontSize:10,color:C.dim,letterSpacing:1}}>TEAMS · 104 MATCHES</div>
          </div>
        </div>

        {/* main tabs */}
        <div className="flex gap-2 mt-5 mb-6">
          {[["schedule","Schedule"],["leaderboard","Leaderboard"],["penalty","Penalties"],["divers","Divers"]].map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)} className="rounded-xl font-bold transition flex-1 sm:flex-none"
              style={{padding:"10px 22px",fontSize:14,letterSpacing:.4,
                background:tab===id?C.gold:C.card, color:tab===id?C.ink:C.text,
                border:"1px solid "+(tab===id?"transparent":C.line)}}>{lbl}</button>
          ))}
        </div>

        {tab==="schedule"&&<Schedule/>}
        {tab==="leaderboard"&&<Leaderboard/>}
        {tab==="penalty"&&<Penalty/>}
        {tab==="divers"&&<Divers/>}

        <div style={{marginTop:40,paddingTop:16,borderTop:"1px solid "+C.lineSoft,fontSize:11,color:C.dim}}>
          Kick-offs converted to AEST (no daylight saving Jun/Jul) and subject to FIFA confirmation ·
          Round-of-32 third-place opponents resolve once the group stage finishes.
        </div>
      </div>
    </div>
  );
}


/* ---- load hosted JSON if present (same folder), else use embedded copy ---- */
function mount(){ ReactDOM.createRoot(document.getElementById("root")).render(<App/>); }
fetch("./sweepstakes.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { DATA = j; })
  .catch(() => {})            // keep embedded fallback
  .finally(mount);

</script>
</body>
</html>
